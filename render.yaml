# Render "Blueprint": tells Render how to build and run Connectly.
# New > Blueprint > pick your GitHub repo. Render asks you for the values marked sync: false.
services:
  - type: web
    name: connectly
    runtime: node
    plan: starter            # a paid plan is needed because the site stores accounts and uploads on a disk
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: connectly-data
      mountPath: /var/data   # accounts, messages, photos and videos live here and survive restarts
      sizeGB: 5              # can be made bigger later (it cannot be made smaller)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true  # Render invents a long random secret for login tokens
      # --- email codes (any SMTP service) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false          # for example: Connectly <no-reply@yourdomain.com>
      # --- text message codes (Twilio) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # --- optional ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
